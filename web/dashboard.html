<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Dashboard · ph.ink</title>
    <link rel="stylesheet" href="./src/main.css" />
  </head>
  <body class="min-h-screen bg-white text-zinc-900">
    <header class="mx-auto flex max-w-3xl flex-wrap items-center justify-between gap-3 px-4 py-6">
      <a href="/" class="text-lg font-bold">ph.ink</a>
      <div class="flex items-center gap-3 text-sm">
        <span id="user-email" class="text-zinc-700"></span>
        <button
          id="sign-out"
          type="button"
          class="rounded-lg border border-zinc-400 px-3 py-1.5 font-semibold hover:bg-zinc-100 focus:outline-none focus:ring-2 focus:ring-zinc-900/30"
        >
          Sign out
        </button>
      </div>
    </header>

    <main class="mx-auto max-w-3xl space-y-8 px-4 pb-16">
      <section aria-labelledby="create-heading">
        <h1 id="create-heading" class="text-2xl font-bold">Create a short link</h1>

        <form id="create-form" class="mt-4 space-y-4">
          <div>
            <label for="destination" class="block text-sm font-semibold">Destination link</label>
            <input
              id="destination"
              name="destination"
              type="url"
              required
              placeholder="https://example.com/a-long-page"
              class="mt-1 w-full rounded-lg border border-zinc-400 px-3 py-2 focus:border-zinc-900 focus:outline-none focus:ring-2 focus:ring-zinc-900/30"
            />
          </div>

          <div class="grid gap-4 sm:grid-cols-2">
            <div>
              <label for="slug" class="block text-sm font-semibold">Custom ending (optional)</label>
              <input
                id="slug"
                name="slug"
                type="text"
                maxlength="32"
                autocomplete="off"
                aria-describedby="slug-hint"
                class="mt-1 w-full rounded-lg border border-zinc-400 px-3 py-2 focus:border-zinc-900 focus:outline-none focus:ring-2 focus:ring-zinc-900/30"
              />
              <p id="slug-hint" class="mt-1 text-xs text-zinc-600">
                3 to 32 letters, numbers, hyphens or underscores. Leave empty for a random one.
              </p>
            </div>
            <div>
              <label for="title" class="block text-sm font-semibold">Name (optional)</label>
              <input
                id="title"
                name="title"
                type="text"
                maxlength="100"
                autocomplete="off"
                class="mt-1 w-full rounded-lg border border-zinc-400 px-3 py-2 focus:border-zinc-900 focus:outline-none focus:ring-2 focus:ring-zinc-900/30"
              />
              <p class="mt-1 text-xs text-zinc-600">Only you can see this.</p>
            </div>
          </div>

          <button
            id="create-button"
            type="submit"
            class="rounded-lg bg-zinc-900 px-4 py-2.5 font-semibold text-white hover:bg-zinc-700 focus:outline-none focus:ring-2 focus:ring-zinc-900/40 disabled:opacity-60"
          >
            Create link
          </button>
        </form>
      </section>

      <p id="status" role="status" aria-live="polite" class="text-sm"></p>

      <section aria-labelledby="links-heading">
        <h2 id="links-heading" class="text-xl font-bold">Your links</h2>
        <p id="empty" class="mt-3 text-zinc-700" hidden>
          You have no links yet. Create your first one above.
        </p>
        <ul id="links" class="mt-4 space-y-3"></ul>
      </section>
    </main>

    <script type="module" src="./src/dashboard.ts"></script>
  </body>
</html>
