<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ph.ink: free short links, QR codes and analytics</title>
    <meta
      name="description"
      content="A free, open-source link shortener with analytics and QR codes."
    />
    <link rel="stylesheet" href="./src/main.css" />
  </head>
  <body class="min-h-screen bg-white text-zinc-900">
    <header class="mx-auto flex max-w-3xl items-center justify-between px-4 py-6">
      <a href="/" class="text-lg font-bold">ph.ink</a>
      <a
        href="/login"
        class="rounded-lg bg-zinc-900 px-4 py-2 text-sm font-semibold text-white hover:bg-zinc-700"
      >
        Sign in
      </a>
    </header>

    <main class="mx-auto max-w-3xl px-4 py-16">
      <h1 class="text-4xl font-extrabold tracking-tight sm:text-5xl">
        Short links and QR codes that stay free.
      </h1>
      <p class="mt-6 text-lg text-zinc-700">
        ph.ink is an open-source link shortener with click analytics and editable QR codes.
        No monthly caps on links, and no tracking cookies.
      </p>
      <p class="mt-4 text-sm text-zinc-600">Early development: not open to the public yet.</p>
    </main>
  </body>
</html>
