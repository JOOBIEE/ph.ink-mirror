name = "ph-ink"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

[assets]
directory = "./web/dist"

[triggers]
crons = ["15 3 * * *"]

[[routes]]
pattern = "phub.ink"
custom_domain = true

[vars]
APP_URL = "https://phub.ink"
TURNSTILE_SITE_KEY = "0x4AAAAAAF6KR0RQlpBQDwpD"
EMAIL_FROM = "phub.ink <login@mail.phub.ink>"

[[d1_databases]]
binding = "DB"
database_name = "ph-ink"
database_id = "dac79dfe-ff3b-4457-9f4c-d849af503c9d"